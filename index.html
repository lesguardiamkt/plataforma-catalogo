<!-- VISOR DE IMÁGENES A TAMAÑO REAL Y GALERÍA (LIGHTBOX) -->
<style>
  .img-zoomable { cursor: zoom-in !important; transition: transform 0.2s ease; }
  .img-zoomable:hover { transform: scale(1.03); }

  #lightbox-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(15, 23, 42, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 999999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #lightbox-overlay.active { display: flex !important; }

  .lightbox-content {
    position: relative;
    max-width: 92vw;
    max-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lightbox-img {
    max-width: 90vw;
    max-height: 82vh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.7);
    cursor: zoom-out;
  }

  .lightbox-btn-close {
    position: absolute;
    top: 20px; right: 25px;
    background: rgba(255, 255, 255, 0.2);
    color: #ffffff;
    border: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    z-index: 1000000;
  }
  .lightbox-btn-close:hover { background: rgba(255, 255, 255, 0.4); }

  .lightbox-nav-btn {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.2);
    color: #ffffff;
    border: none;
    width: 50px; height: 50px;
    border-radius: 50%;
    font-size: 26px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    z-index: 1000000;
  }
  .lightbox-nav-btn:hover { background: rgba(255, 255, 255, 0.4); }
  .lightbox-prev { left: 20px; }
  .lightbox-next { right: 20px; }

  .lightbox-caption {
    color: #f1f5f9;
    margin-top: 14px;
    font-size: 0.95rem;
    font-weight: 500;
    text-align: center;
  }
</style>

<div id="lightbox-overlay" onclick="cerrarLightbox(event)">
  <button class="lightbox-btn-close" onclick="cerrarLightboxForce()">&times;</button>
  <button id="lightbox-prev-btn" class="lightbox-nav-btn lightbox-prev" onclick="navegarLightbox(-1, event)">&#10094;</button>
  
  <div class="lightbox-content" onclick="event.stopPropagation()">
    <img id="lightbox-img-target" class="lightbox-img" src="" alt="Foto ampliada" onclick="cerrarLightboxForce()">
  </div>

  <button id="lightbox-next-btn" class="lightbox-nav-btn lightbox-next" onclick="navegarLightbox(1, event)">&#10095;</button>
  <div id="lightbox-caption-text" class="lightbox-caption"></div>
</div>

<script>
  let lightboxGaleria = [];
  let lightboxIndex = 0;

  function abrirFotoAmpliada(itemFotos, indexInicial = 0) {
    if (!itemFotos) return;
    if (typeof itemFotos === 'string') {
      lightboxGaleria = [itemFotos];
    } else if (Array.isArray(itemFotos)) {
      lightboxGaleria = itemFotos.filter(f => f && typeof f === 'string');
    }
    if (lightboxGaleria.length === 0) return;

    lightboxIndex = indexInicial >= 0 && indexInicial < lightboxGaleria.length ? indexInicial : 0;
    renderizarLightbox();
    document.getElementById('lightbox-overlay').classList.add('active');
    document.body.style.overflow = 'hidden'; // Bloquea el scroll de fondo
  }

  function renderizarLightbox() {
    const imgEl = document.getElementById('lightbox-img-target');
    const txtEl = document.getElementById('lightbox-caption-text');
    const btnPrev = document.getElementById('lightbox-prev-btn');
    const btnNext = document.getElementById('lightbox-next-btn');

    imgEl.src = lightboxGaleria[lightboxIndex];

    if (lightboxGaleria.length > 1) {
      txtEl.innerText = `Foto ${lightboxIndex + 1} de ${lightboxGaleria.length}`;
      btnPrev.style.display = 'flex';
      btnNext.style.display = 'flex';
    } else {
      txtEl.innerText = 'Toca fuera o la cruz para cerrar';
      btnPrev.style.display = 'none';
      btnNext.style.display = 'none';
    }
  }

  function navegarLightbox(dir, e) {
    if (e) e.stopPropagation();
    lightboxIndex += dir;
    if (lightboxIndex < 0) lightboxIndex = lightboxGaleria.length - 1;
    if (lightboxIndex >= lightboxGaleria.length) lightboxIndex = 0;
    renderizarLightbox();
  }

  function cerrarLightbox(e) {
    if (e.target.id === 'lightbox-overlay') cerrarLightboxForce();
  }

  function cerrarLightboxForce() {
    document.getElementById('lightbox-overlay').classList.remove('active');
    document.body.style.overflow = 'auto';
  }

  // Teclas de acceso rápido (Esc para cerrar, flechas para navegar)
  document.addEventListener('keydown', function(e) {
    const overlay = document.getElementById('lightbox-overlay');
    if (overlay && overlay.classList.contains('active')) {
      if (e.key === 'Escape') cerrarLightboxForce();
      if (e.key === 'ArrowLeft') navegarLightbox(-1);
      if (e.key === 'ArrowRight') navegarLightbox(1);
    }
  });
</script>
