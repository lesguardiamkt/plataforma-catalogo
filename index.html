<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LesLab - Automatizador con Márgenes por Categoria</title>
  <style>
    :root { --primary: #0076d6; --success: #25D366; --bg: #f4f6f9; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
    .panel { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 1.4rem; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 12px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-weight: bold; font-size: 0.85rem; color: #555; }
    input, select { padding: 9px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.9rem; }
    
    .box-margenes { background: #fff8e7; border: 1px solid #ffeaa7; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .box-margenes h3 { margin-top: 0; font-size: 1rem; color: #d63031; }

    .btn-main { width: 100%; background: var(--success); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .output-area { margin-top: 20px; display: none; }
    textarea { width: 100%; height: 200px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; font-family: monospace; font-size: 0.8rem; box-sizing: border-box; }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn-sub { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #333; color: white; }
  </style>
</head>
<body>

<div class="panel">
  <h1>⚡ LesLab Admin — Procesador con Margen por Categoría</h1>

  <div class="grid">
    <div class="field">
      <label>1. Seleccionar Tienda</label>
      <select id="tienda">
        <option value="aluney">ALUNEY</option>
        <option value="tienda2">Tienda 2</option>
        <option value="tienda3">Tienda 3</option>
        <option value="tienda4">Tienda 4</option>
      </select>
    </div>

    <div class="field">
      <label>2. Comisión Ualá Bis</label>
      <select id="tipo-comision">
        <option value="cuotas">3 Cuotas (12% + IVA = 14.52%)</option>
        <option value="directo">1 Pago / Link (4.9% + IVA = 5.93%)</option>
      </select>
    </div>
  </div>

  <!-- SECCIÓN DE MÁRGENES POR CATEGORÍA -->
  <div class="box-margenes">
    <h3>📊 Reglas de Ganancia Neto por Categoría (%)</h3>
    <div class="grid">
      <div class="field">
        <label>Maquillaje / Facial (%)</label>
        <input type="number" id="m-maquillaje" value="45">
      </div>
      <div class="field">
        <label>Calzado / Zapatillas (%)</label>
        <input type="number" id="m-calzado" value="25">
      </div>
      <div class="field">
        <label>Ropa / Indumentaria (%)</label>
        <input type="number" id="m-ropa" value="35">
      </div>
      <div class="field">
        <label>Accesorios / Bisutería (%)</label>
        <input type="number" id="m-accesorios" value="60">
      </div>
      <div class="field">
        <label>Otras Categorías (%)</label>
        <input type="number" id="m-general" value="30">
      </div>
    </div>
  </div>

  <div class="field" style="margin-bottom: 15px;">
    <label>3. Subir archivo JSON del Scraper</label>
    <input type="file" id="archivo-scraper" accept=".json">
  </div>

  <button class="btn-main" onclick="procesarScraper()">🚀 PROCESAR CATEGORÍAS, VARIANTES Y PRECIOS</button>

  <div class="output-area" id="bloque-salida">
    <textarea id="json-resultado" readonly></textarea>
    <div class="actions">
      <button class="btn-sub" onclick="copiarAlPortapapeles()">📋 Copiar JSON</button>
      <button class="btn-sub" style="background: var(--primary);" onclick="descargarJSON()">💾 Descargar productos.json</button>
    </div>
  </div>
</div>

<script>
  function obtenerMargenPorCategoria(cat) {
    const c = (cat || "").toLowerCase();
    if (c.includes('maquillaje') || c.includes('facial') || c.includes('crema') || c.includes('serum')) {
      return parseFloat(document.getElementById('m-maquillaje').value) / 100;
    }
    if (c.includes('calzado') || c.includes('zapatilla') || c.includes('bota') || c.includes('sandalia')) {
      return parseFloat(document.getElementById('m-calzado').value) / 100;
    }
    if (c.includes('ropa') || c.includes('indumentaria') || c.includes('remera') || c.includes('pantalon')) {
      return parseFloat(document.getElementById('m-ropa').value) / 100;
    }
    if (c.includes('accesorio') || c.includes('aro') || c.includes('anillo') || c.includes('cadena')) {
      return parseFloat(document.getElementById('m-accesorios').value) / 100;
    }
    return parseFloat(document.getElementById('m-general').value) / 100;
  }

  function estimarPeso(nombre, categoria) {
    const texto = (nombre + " " + (categoria || "")).toLowerCase();
    if (texto.includes('máscara') || texto.includes('labial')) return 100;
    if (texto.includes('serum') || texto.includes('crema')) return 200;
    if (texto.includes('zapatilla') || texto.includes('calzado')) return 800;
    if (texto.includes('remera') || texto.includes('ropa')) return 300;
    if (texto.includes('anillo') || texto.includes('accesorio')) return 50;
    return 150;
  }

  function procesarScraper() {
    const fileInput = document.getElementById('archivo-scraper');
    if (!fileInput.files.length) return alert('Selecciona el archivo .json del scraper.');

    const tiendaSel = document.getElementById('tienda').value;
    const tipoComision = document.getElementById('tipo-comision').value;

    let comisionUala = (tipoComision === 'cuotas') ? (0.12 * 1.21) : (0.049 * 1.21);
    const impuestoProvincial = 0.035;
    const deduccionTotal = comisionUala + impuestoProvincial;

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
      try {
        const datosRaw = JSON.parse(e.target.result);

        const productosProcesados = datosRaw.map((item, idx) => {
          const costo = parseFloat(item.precio_costo || item.costo || item.precio || 0);
          const categoria = item.categoria || item.seccion || 'General';
          
          // Selecciona el margen dinámico según la categoría detectada
          const margenNeto = obtenerMargenPorCategoria(categoria);
          const precioLista = Math.round((costo * (1 + margenNeto)) / (1 - deduccionTotal));

          return {
            tienda: tiendaSel,
            id: idx + 1,
            seccion: categoria,
            nombre: item.nombre,
            costo: costo,
            lista: precioLista,
            cuotas: (tipoComision === 'cuotas') ? 3 : 1,
            stock: item.stock !== undefined ? parseInt(item.stock) : 10,
            variantes: item.variantes || item.talles || item.colores || [], // Captura Talles / Colores / Tonos
            peso: item.peso ? parseInt(item.peso) : estimarPeso(item.nombre, categoria),
            imagen: item.imagen_url || item.imagen || ''
          };
        });

        document.getElementById('json-resultado').value = JSON.stringify(productosProcesados, null, 2);
        document.getElementById('bloque-salida').style.display = 'block';
        alert(`¡Completado! Se procesaron ${productosProcesados.length} productos aplicando márgenes por categoría, variantes y comisiones.`);

      } catch(err) {
        alert('Error al leer el JSON del scraper.');
      }
    };

    reader.readAsText(file);
  }

  function copiarAlPortapapeles() {
    const txt = document.getElementById('json-resultado');
    txt.select();
    document.execCommand('copy');
    alert('¡Copiado! Pégalo en tu productos.json en GitHub.');
  }

  function descargarJSON() {
    const text = document.getElementById('json-resultado').value;
    const blob = new Blob([text], { type: "application/json" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "productos.json";
    a.click();
  }
</script>
</body>
</html>
