<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LesLab - Hub de Automatización & Multi-Scraper</title>
  <style>
    :root { --primary: #0076d6; --success: #25D366; --bg: #f4f6f9; --border: #e2e8f0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
    .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { font-size: 1.5rem; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    label { font-weight: 600; font-size: 0.85rem; color: #475569; }
    input, select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }
    .btn-main { width: 100%; background: var(--success); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
    textarea { width: 100%; height: 220px; border-radius: 8px; border: 1px solid var(--border); padding: 10px; font-family: monospace; font-size: 0.8rem; background: #0f172a; color: #38bdf8; box-sizing: border-box; }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn-sub { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #333; color: white; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚙️ Hub Integrador de Scrapers (Soporte CSV + JSON)</h1>

  <div class="grid">
    <div class="field">
      <label>1. Emprendimiento Destino</label>
      <select id="tienda-destino">
        <option value="aluney">ALUNEY</option>
        <option value="tienda2">Tienda 2</option>
        <option value="tienda3">Tienda 3</option>
        <option value="tienda4">Tienda 4</option>
      </select>
    </div>

    <div class="field">
      <label>2. Comisión Ualá Bis</label>
      <select id="tipo-comision">
        <option value="cuotas">3 Cuotas (12% + IVA = 14.52%)</option>
        <option value="directo">1 Pago (4.9% + IVA = 5.93%)</option>
      </select>
    </div>
  </div>

  <div class="grid">
    <div class="field">
      <label>3. Margen de Ganancia Neto (%)</label>
      <input type="number" id="margen" value="30">
    </div>

    <div class="field">
      <label>4. Subir Archivo (.CSV o .JSON)</label>
      <input type="file" id="file-input" accept=".csv, .json">
    </div>
  </div>

  <button class="btn-main" onclick="procesarArchivo()">🚀 PROCESAR Y GENERAR CATALOGO</button>

  <div style="margin-top: 20px; display: none;" id="bloque-salida">
    <textarea id="json-resultado" readonly></textarea>
    <div class="actions">
      <button class="btn-sub" onclick="copiarJSON()">📋 Copiar JSON</button>
      <button class="btn-sub" style="background: var(--primary);" onclick="descargarJSON()">💾 Descargar productos.json</button>
    </div>
  </div>
</div>

<script>
  function estimarPesoInteligente(nombre) {
    const txt = (nombre || "").toLowerCase();
    if (txt.includes('máscara') || txt.includes('mascarilla') || txt.includes('labial')) return 100;
    if (txt.includes('ampolla') || txt.includes('serum') || txt.includes('crema')) return 200;
    if (txt.includes('zapatilla') || txt.includes('calzado')) return 800;
    return 150;
  }

  function procesarArchivo() {
    const fileInput = document.getElementById('file-input');
    if (!fileInput.files.length) return alert('Por favor selecciona el archivo .CSV descargado de tu scraper.');

    const tiendaSel = document.getElementById('tienda-destino').value;
    const margenNeto = parseFloat(document.getElementById('margen').value) / 100;
    const tipoComision = document.getElementById('tipo-comision').value;

    let comisionUala = (tipoComision === 'cuotas') ? (0.12 * 1.21) : (0.049 * 1.21);
    const deduccionTotal = comisionUala + 0.035;

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
      try {
        let listaOriginal = [];
        const contenido = e.target.result;

        if (file.name.endsWith('.csv')) {
          // Parseador de CSV
          const lineas = contenido.split('\n').filter(l => l.trim() !== '');
          const cabeceras = lineas[0].split(',').map(c => c.trim().replace(/"/g, ''));

          for (let i = 1; i < lineas.length; i++) {
            const columnas = lineas[i].split(',').map(c => c.trim().replace(/"/g, ''));
            if (columnas.length >= 2) {
              listaOriginal.push({
                nombre: columnas[0], // Primera columna (data)
                precio_costo: columnas[1] // Segunda columna (data2)
              });
            }
          }
        } else {
          listaOriginal = JSON.parse(contenido);
        }

        const productosProcesados = listaOriginal.map((item, idx) => {
          // Limpia el formato de precio ($5.299 -> 5299)
          let precioLimpio = String(item.precio_costo || item.costo || item.precio || 0)
            .replace(/\$/g, '')
            .replace(/\./g, '')
            .replace(/,/g, '.')
            .trim();
          
          const costo = parseFloat(precioLimpio) || 0;
          const nombre = item.nombre || 'Producto sin nombre';
          const precioLista = Math.round((costo * (1 + margenNeto)) / (1 - deduccionTotal));

          return {
            tienda: tiendaSel,
            id: idx + 1,
            seccion: 'Cuidado Facial',
            nombre: nombre,
            costo: costo,
            lista: precioLista,
            cuotas: (tipoComision === 'cuotas') ? 3 : 1,
            stock: 10,
            variantes: [],
            peso: estimarPesoInteligente(nombre),
            imagen: ''
          };
        });

        document.getElementById('json-resultado').value = JSON.stringify(productosProcesados, null, 2);
        document.getElementById('bloque-salida').style.display = 'block';
        alert(`¡Éxito! Se procesaron ${productosProcesados.length} productos desde el archivo CSV.`);

      } catch(err) {
        alert('Ocurrió un error al procesar el archivo CSV.');
      }
    };

    reader.readAsText(file);
  }

  function copiarJSON() {
    const txt = document.getElementById('json-resultado');
    txt.select();
    document.execCommand('copy');
    alert('¡Copiado! Pégalo en tu productos.json en GitHub.');
  }

  function descargarJSON() {
    const text = document.getElementById('json-resultado').value;
    const blob = new Blob([text], { type: "application/json" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "productos.json";
    a.click();
  }
</script>
</body>
</html>
